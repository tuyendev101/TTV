name: n8n TTS Automation
on:
  repository_dispatch:
    types: [generate_tts_event]

jobs:
  generate_audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install python dependencies
        run: |
          pip install vieneu
          pip install requests

      - name: Run n8n Adapter
        env:
          PAYLOAD_DATA: ${{ toJson(github.event.client_payload) }}
          HF_HUB_DISABLE_SYMLINKS: "1"
        run: python n8n_adapter.py
